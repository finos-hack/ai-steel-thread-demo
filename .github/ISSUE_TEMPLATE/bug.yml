name: Bug
description: Something is broken or behaves incorrectly
title: "[Bug] "
labels: ["type:bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
  - type: dropdown
    id: release
    attributes:
      label: Target release
      description: Also set the matching GitHub milestone on the issue.
      options:
        - v1.1.0
        - v1.2.0
        - Backlog
      default: 0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Launch UI path, API call, or Docker steps.
  - type: input
    id: env
    attributes:
      label: Environment
      description: Docker Compose, local Maven, browser, etc.
