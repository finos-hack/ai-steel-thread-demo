# Full-stack demo: Spring Boot app + Launch UI + observability.
#
#   cp .env.example .env   # set OPENAI_API_KEY / ANTHROPIC_API_KEY
#   docker compose up --build
#
# UI:        http://localhost:5173
# API/Cockpit: http://localhost:8080
# Grafana:   http://localhost:3000
# CALM Hub:  http://localhost:8090

name: ai-steel-thread-demo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLUGINS_REPO: ${PLUGINS_REPO:-https://github.com/finos/fluxnova-plugins.git}
        PLUGINS_REF: ${PLUGINS_REF:-llm-token-usage}
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
    depends_on:
      - tempo
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  grafana:
    image: grafana/grafana:11.6.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fluxnova-task-execution.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo

  # FINOS CALM Hub (official visualizer for loan-approval.calm.json)
  calm-mongodb:
    image: mongo:7
    ports:
      - "27018:27017"

  calmhub:
    image: finos/calm-hub:latest
    ports:
      - "8090:8080"
    environment:
      JAVA_OPTS: >-
        -Dquarkus.mongodb.connection-string=mongodb://calm-mongodb:27017
        -Dquarkus.profile=no-auth
        -Dcalm.hub.base-url=http://localhost:8090
    depends_on:
      - calm-mongodb

  # One-shot init job (expected status: Exited 0 after seeding — not a long-running service).
  calmhub-seed:
    image: curlimages/curl:8.12.1
    depends_on:
      calmhub:
        condition: service_started
    volumes:
      - ./architecture/loan-approval.calm.json:/data/loan-approval.calm.json:ro
      - ./docker/calmhub-seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
    restart: "no"
