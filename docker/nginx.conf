server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS — re-resolve `app` so recreating the backend
  # does not leave nginx stuck on a stale container IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Demo REST API (no URI on proxy_pass → original path is preserved)
  location /api/ {
    set $upstream_host app;
    proxy_pass http://$upstream_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # Fluxnova Engine REST (optional; useful for tooling)
  location /engine-rest/ {
    set $upstream_host app;
    proxy_pass http://$upstream_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Same-origin Hub probe for the Launch UI (avoids browser CORS to :8090).
  location = /calm-hub-status {
    set $upstream_calmhub calmhub;
    proxy_pass http://$upstream_calmhub:8080/q/openapi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
